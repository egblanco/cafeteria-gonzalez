<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Simple - Cafetería González</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 600px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #6d4c41 0%, #3e2723 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .chat-header h1 {
            font-size: 1.5em;
            margin-bottom: 5px;
        }

        .chat-header p {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #f5f5f5;
        }

        .message {
            display: flex;
            gap: 10px;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .message.assistant .message-avatar {
            background: linear-gradient(135deg, #6d4c41 0%, #3e2723 100%);
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 15px;
            line-height: 1.5;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 5px;
        }

        .message.assistant .message-content {
            background: white;
            color: #333;
            border-bottom-left-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .quick-replies {
            padding: 10px 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            max-height: 150px;
            overflow-y: auto;
        }

        .quick-reply-btn {
            background: #6d4c41;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Georgia', serif;
            font-size: 0.9em;
            transition: all 0.2s;
        }

        .quick-reply-btn:hover {
            background: #3e2723;
            transform: translateY(-2px);
        }

        .chat-input-container {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 14px;
            font-family: 'Georgia', serif;
            transition: border-color 0.3s;
        }

        .chat-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .send-button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #6d4c41 0%, #3e2723 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            font-family: 'Georgia', serif;
            transition: all 0.3s;
        }

        .send-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        @media (max-width: 600px) {
            .chat-container {
                height: 100vh;
                max-height: 100vh;
                border-radius: 0;
            }

            .message-content {
                max-width: 80%;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>☕ Chatbot - Cafetería González</h1>
            <p>Asistente virtual sobre café</p>
            <small style="opacity: 0.8; font-size: 0.8em;">💬 100% Gratis - Sin servidor</small>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message assistant">
                <div class="message-avatar">🤖</div>
                <div class="message-content">
                    ¡Hola! Soy tu asistente virtual de Cafetería González. Te puedo ayudar con información sobre café, recetas y más. ¿En qué puedo ayudarte?
                </div>
            </div>
        </div>

        <div class="quick-replies" id="quickReplies">
            <button class="quick-reply-btn" onclick="sendQuickReply('¿Qué es un espresso?')">¿Qué es un espresso?</button>
            <button class="quick-reply-btn" onclick="sendQuickReply('¿Cómo hacer capuchino?')">¿Cómo hacer capuchino?</button>
            <button class="quick-reply-btn" onclick="sendQuickReply('Tipos de café')">Tipos de café</button>
            <button class="quick-reply-btn" onclick="sendQuickReply('¿Qué es latte?')">¿Qué es latte?</button>
        </div>

        <div class="chat-input-container">
            <input
                type="text"
                class="chat-input"
                id="chatInput"
                placeholder="Escribe tu pregunta aquí..."
                autocomplete="off"
            >
            <button class="send-button" id="sendButton">Enviar</button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const sendButton = document.getElementById('sendButton');

        // Base de conocimiento sobre café
        const knowledge = {
            'espresso': {
                keywords: ['espresso', 'expreso', 'express'],
                response: 'El **espresso** es un café corto e intenso preparado forzando agua caliente a presión a través de café molido fino. Se caracteriza por su crema dorada en la superficie y su sabor concentrado. La preparación toma entre 25-30 segundos y usa 7-9 gramos de café.'
            },
            'capuchino': {
                keywords: ['capuchino', 'cappuccino', 'capucino'],
                response: 'El **capuchino** es una bebida italiana compuesta por espresso, leche caliente y espuma de leche en partes iguales. Se prepara vaporizando la leche hasta crear una espuma cremosa, luego se vierte sobre el espresso. Opcionalmente se espolvorea con canela o cacao.'
            },
            'latte': {
                keywords: ['latte', 'late', 'café con leche'],
                response: 'El **latte** (o café con leche) es una bebida suave que combina espresso con una generosa cantidad de leche caliente (150-200ml). La proporción es aproximadamente 1/3 de espresso y 2/3 de leche. Es ideal para quienes prefieren un sabor más suave.'
            },
            'macchiato': {
                keywords: ['macchiato', 'manchado', 'macciato'],
                response: 'El **latte macchiato** se caracteriza por sus tres capas distintivas: leche caliente en el fondo, espresso en el medio y espuma de leche arriba. Se prepara virtiendo el espresso lentamente sobre la leche vaporizada en un vaso alto de vidrio.'
            },
            'mocha': {
                keywords: ['mocha', 'moka', 'chocolate'],
                response: 'El **mocha** es una deliciosa combinación de espresso, leche caliente y chocolate (15-20g). Se prepara derritiendo el chocolate con leche caliente, mezclando con espresso y completando con espuma. Opcionalmente se decora con crema batida y cacao en polvo.'
            },
            'bombon': {
                keywords: ['bombón', 'bombon', 'condensada'],
                response: 'El **café bombón** es una bebida dulce y reconfortante que combina espresso con leche condensada. Se sirve en un vaso de vidrio para apreciar las dos capas: leche condensada abajo y espresso arriba. No necesita azúcar adicional debido a la dulzura de la leche condensada.'
            },
            'flat white': {
                keywords: ['flat white', 'flatwhite', 'flat'],
                response: 'El **flat white** es una bebida australiana similar al latte pero con menos leche y una capa más fina de microespuma. Usa un espresso doble (60ml) con 120ml de leche caliente perfectamente texturizada. Tiene un sabor más fuerte a café que el latte.'
            },
            'cortado': {
                keywords: ['cortado', 'cortao'],
                response: 'El **cortado** es un espresso "cortado" con una pequeña cantidad de leche caliente (50-100ml). La leche suaviza el sabor intenso del espresso sin dominarlo. Es perfecto para quienes quieren disfrutar del café con un toque de suavidad.'
            },
            'tipos': {
                keywords: ['tipos', 'cuales', 'menu', 'opciones', 'que hay'],
                response: 'En Cafetería González ofrecemos:\n\n**Básicos:**\n• Espresso\n• Café con leche\n• Capuchino\n• Cortado\n\n**Especiales:**\n• Latte Macchiato\n• Bombón\n• Mocha\n• Flat White\n\n**Premium:**\n• Latte Miel y Canela\n• Affogato\n• Café Frío\n\n¡Todos preparados con amor y café de calidad!'
            },
            'preparacion': {
                keywords: ['preparar', 'hacer', 'receta', 'como se hace'],
                response: 'Para preparar un buen café necesitas:\n\n1. **Café de calidad**: Usa granos frescos recién molidos\n2. **Temperatura correcta**: El agua debe estar entre 90-96°C\n3. **Proporción adecuada**: 7-9g de café por 25-30ml de agua para espresso\n4. **Tiempo preciso**: 25-30 segundos de extracción\n5. **Leche fresca**: Para bebidas con leche, vaporiza entre 60-65°C\n\n¿Qué café específico quieres aprender a preparar?'
            },
            'precio': {
                keywords: ['precio', 'costo', 'cuanto', 'vale'],
                response: 'Para información sobre precios y pedidos, te recomiendo:\n\n1. Visitar nuestro local directamente\n2. Llamarnos por teléfono\n3. Escribirnos por WhatsApp\n\nLos precios varían según el tipo de café y el tamaño. ¡Estamos para servirte!'
            },
            'horario': {
                keywords: ['horario', 'hora', 'abierto', 'cierra', 'abre'],
                response: 'Nuestro horario es:\n\n📅 Lunes a Viernes: 7:00 AM - 8:00 PM\n📅 Sábados: 8:00 AM - 9:00 PM\n📅 Domingos: 9:00 AM - 6:00 PM\n\n¡Te esperamos! ☕'
            },
            'ubicacion': {
                keywords: ['ubicacion', 'dirección', 'direccion', 'donde', 'como llegar'],
                response: 'Estamos ubicados en el corazón de la ciudad. Para información exacta sobre nuestra ubicación:\n\n📍 Consulta el menú principal\n📞 Contáctanos directamente\n🗺️ Búscanos en Google Maps como "Cafetería González"\n\n¡Esperamos tu visita!'
            }
        };

        // Agregar mensaje al chat
        function addMessage(content, isUser = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'assistant'}`;

            messageDiv.innerHTML = `
                <div class="message-avatar">${isUser ? '👤' : '🤖'}</div>
                <div class="message-content">${content}</div>
            `;

            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Buscar respuesta en la base de conocimiento
        function findResponse(userMessage) {
            const lowerMessage = userMessage.toLowerCase();

            // Buscar coincidencias en keywords
            for (const [key, data] of Object.entries(knowledge)) {
                for (const keyword of data.keywords) {
                    if (lowerMessage.includes(keyword)) {
                        return data.response;
                    }
                }
            }

            // Respuesta por defecto
            return `Interesante pregunta sobre "${userMessage}". Te puedo ayudar con información sobre:\n\n• Tipos de café (espresso, capuchino, latte, etc.)\n• Cómo preparar diferentes bebidas\n• Horarios y ubicación\n\n¿Sobre qué te gustaría saber más?`;
        }

        // Enviar mensaje
        function sendMessage() {
            const userMessage = chatInput.value.trim();

            if (!userMessage) return;

            // Agregar mensaje del usuario
            addMessage(userMessage, true);
            chatInput.value = '';

            // Simular "escribiendo..."
            setTimeout(() => {
                const response = findResponse(userMessage);
                addMessage(response);
            }, 500);
        }

        // Enviar respuesta rápida
        function sendQuickReply(message) {
            chatInput.value = message;
            sendMessage();
        }

        // Event listeners
        sendButton.addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Focus en el input al cargar
        chatInput.focus();
    </script>
</body>
</html>
